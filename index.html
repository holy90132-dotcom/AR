  <title>娜美卡片 WebAR Demo</title>

  <!-- MindAR image tracking + A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b12;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #ar-root { position: fixed; inset: 0; }
    #ui {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center;
      pointer-events: none;
    }
    .panel {
      width: min(86vw, 430px);
      padding: 22px 20px;
      border-radius: 22px;
      background: rgba(8, 11, 18, .82);
      backdrop-filter: blur(14px);
      color: white;
      text-align: center;
      box-shadow: 0 18px 70px rgba(0,0,0,.45);
      pointer-events: auto;
    }
    .title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    #status { opacity: .82; line-height: 1.6; font-size: 14px; }
    #progress {
      height: 8px; overflow: hidden; border-radius: 999px;
      background: rgba(255,255,255,.12); margin: 16px 0;
    }
    #bar {
      width: 0%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg,#55d7ff,#ffe178);
      transition: width .12s linear;
    }
    button {
      width: 100%; border: 0; border-radius: 14px;
      padding: 13px 16px; margin-top: 14px;
      font-size: 16px; font-weight: 800;
      background: white; color: #111827;
      display: none; cursor: pointer;
    }
    #scanHint {
      position: fixed; z-index: 15; left: 50%; top: 24px;
      transform: translateX(-50%);
      padding: 10px 16px; border-radius: 999px;
      background: rgba(0,0,0,.58); color: white;
      font-size: 14px; backdrop-filter: blur(8px);
      display: none; pointer-events: none;
    }
    #found {
      position: fixed; z-index: 16; left: 50%; bottom: 28px;
      transform: translateX(-50%) scale(.92);
      padding: 11px 18px; border-radius: 999px;
      background: rgba(255,255,255,.92); color:#111827;
      font-weight: 900; opacity: 0;
      transition: .22s ease; pointer-events: none;
    }
    #found.show { opacity: 1; transform: translateX(-50%) scale(1); }
  </style>
</head>

  const statusEl = document.getElementById("status");
  const barEl = document.getElementById("bar");
  const startBtn = document.getElementById("startBtn");
  const panel = document.getElementById("panel");
  const scanHint = document.getElementById("scanHint");
  const foundToast = document.getElementById("found");
  const root = document.getElementById("ar-root");

  let mindBlobUrl = null;

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = src;
    });
  }

  async function prepareTarget() {
    try {
      const CompilerClass =
        window.MINDAR?.IMAGE?.Compiler ||
        window.MINDAR?.Compiler;

      if (!CompilerClass) {
        throw new Error("找不到 MindAR Compiler。請確認網路可連到 jsDelivr。");
      }

      const image = await loadImage(TARGET_DATA_URL);
      const compiler = new CompilerClass();

      statusEl.textContent = "分析卡面特徵中，第一次開啟會稍等一下…";

      await compiler.compileImageTargets([image], (progress) => {
        const p = Math.max(0, Math.min(100, Number(progress) || 0));
        barEl.style.width = p + "%";
        statusEl.textContent = `分析卡面特徵中… ${p.toFixed(0)}%`;
      });

      const buffer = await compiler.exportData();
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      mindBlobUrl = URL.createObjectURL(blob);

      barEl.style.width = "100%";
      statusEl.innerHTML =
        "準備完成。<br>按下開始後允許相機權限，再把鏡頭對準卡片。";
      startBtn.style.display = "block";
    } catch (err) {
      console.error(err);
      statusEl.innerHTML =
        "準備失敗：<br>" + (err?.message || err) +
        "<br><br>請用 Chrome / Safari 並保持網路連線。";
    }
  }

  function startAR() {
    if (!mindBlobUrl) return;

    panel.style.display = "none";
    scanHint.style.display = "block";

    // Create the AR scene only after the target has been compiled.
    // The animation consists entirely of A-Frame primitives: no extra model files needed.
    root.innerHTML = `
      <a-scene
        embedded
        mindar-image="imageTargetSrc: ${mindBlobUrl}; maxTrack: 1; filterMinCF: 0.001; filterBeta: 0.01;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target" mindar-image-target="targetIndex: 0">

          <!-- glow plate hovering just above the card -->
          <a-plane
            position="0 0 0.025"
            width="1.02" height="1.48"
            material="color:#21d4fd; opacity:0.10; transparent:true; shader:flat"
            animation__pulse="property: material.opacity; from:0.06; to:0.22; dur:800; dir:alternate; loop:true">
          </a-plane>

          <!-- rotating holographic rings -->
          <a-torus
            position="0 0.12 0.14"
            radius="0.38" radius-tubular="0.012"
            material="color:#66e7ff; emissive:#66e7ff; emissiveIntensity:1"
            rotation="70 0 0"
            animation="property: rotation; to:70 360 0; dur:2600; easing:linear; loop:true">
          </a-torus>

          <a-torus
            position="0 0.12 0.18"
            radius="0.29" radius-tubular="0.009"
            material="color:#ffd86b; emissive:#ffd86b; emissiveIntensity:1"
            rotation="105 0 0"
            animation="property: rotation; to:105 -360 0; dur:1800; easing:linear; loop:true">
          </a-torus>

          <!-- little 'treasure' gems orbiting -->
          <a-entity
            position="0 0.12 0.22"
            animation="property: rotation; to:0 0 360; dur:2200; easing:linear; loop:true">
            <a-sphere position="0.34 0 0" radius="0.045"
              material="color:#ffd64a; emissive:#ffbb00; emissiveIntensity:.7"></a-sphere>
            <a-sphere position="-0.25 0.22 0" radius="0.035"
              material="color:#58dcff; emissive:#58dcff; emissiveIntensity:.8"></a-sphere>
            <a-sphere position="-0.15 -0.31 0" radius="0.03"
              material="color:#ffffff; emissive:#ffffff; emissiveIntensity:.8"></a-sphere>
          </a-entity>

          <!-- popup card -->
          <a-plane
            position="0 0.15 0.32"
            width="0.72" height="0.27"
            material="color:#07121f; opacity:.88; transparent:true"
            animation__float="property: position; from:0 0.11 0.30; to:0 0.19 0.35; dur:900; dir:alternate; loop:true">
          </a-plane>

          <a-text
            value="TARGET FOUND!"
            align="center"
            color="#ffffff"
            width="1.55"
            position="0 0.20 0.345">
          </a-text>

          <a-text
            value="NAMI AR"
            align="center"
            color="#ffd86b"
            width="1.15"
            position="0 0.095 0.345">
          </a-text>
        </a-entity>
      </a-scene>
    `;

    const target = document.getElementById("target");

    target.addEventListener("targetFound", () => {
      scanHint.style.display = "none";
      foundToast.classList.add("show");
      setTimeout(() => foundToast.classList.remove("show"), 1400);
    });

    target.addEventListener("targetLost", () => {
      scanHint.style.display = "block";
    });
  }

  startBtn.addEventListener("click", startAR);
  prepareTarget();
})();
</script>
</body>
</html>
