<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>AR Story</title>


<!-- MindAR -->

<script
  src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js">
</script>


<!-- A-Frame -->

<script
  src="https://aframe.io/releases/1.2.0/aframe.min.js">
</script>


<!-- MindAR + A-Frame -->

<script
  src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js">
</script>



<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #050914;

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

}



#ar {

  position: fixed;

  inset: 0;

}



#overlay {

  position: fixed;

  inset: 0;

  z-index: 30;

  display: grid;

  place-items: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(40, 130, 255, 0.25),
      transparent 45%
    ),
    rgba(3, 7, 15, 0.92);

}



.panel {

  width: min(90vw, 430px);

  padding: 24px 20px;

  border-radius: 22px;

  background:
    rgba(12, 19, 33, 0.96);

  color: white;

  box-shadow:
    0 24px 80px
    rgba(0, 0, 0, 0.5);

}



h1 {

  margin: 0 0 10px;

  font-size: 24px;

}



.description {

  font-size: 14px;

  line-height: 1.7;

  opacity: 0.8;

}



#startBtn {

  width: 100%;

  margin-top: 18px;

  padding: 15px;

  border: 0;

  border-radius: 14px;

  background: white;

  color: #09101c;

  font-size: 17px;

  font-weight: 800;

  cursor: pointer;

}



#startBtn:disabled {

  opacity: 0.5;

}



#status {

  margin-top: 15px;

  padding: 12px;

  min-height: 65px;

  border-radius: 14px;

  background:
    rgba(255, 255, 255, 0.05);

  font-size: 13px;

  line-height: 1.6;

  white-space: pre-wrap;

}



#hint {

  position: fixed;

  left: 50%;

  top: 20px;

  transform:
    translateX(-50%);

  z-index: 20;

  display: none;

  padding:
    10px 16px;

  border-radius:
    999px;

  background:
    rgba(0, 0, 0, 0.62);

  color: white;

  font-size: 14px;

  white-space: nowrap;

  backdrop-filter:
    blur(10px);

}



#found {

  position: fixed;

  left: 50%;

  bottom: 28px;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index: 22;

  opacity: 0;

  padding:
    12px 18px;

  border-radius:
    999px;

  background:
    rgba(255, 255, 255, 0.96);

  color:
    #07111e;

  font-weight: 900;

  transition:
    0.25s ease;

}



#found.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);

}

</style>

</head>



<body>


<div id="ar"></div>



<div id="overlay">

  <div class="panel">

    <h1>
      開啟故事
    </h1>

    <div class="description">

      請使用 Chrome 或 Safari 開啟。<br>

      按下開始後允許使用相機，<br>

      再把鏡頭對準卡片。

    </div>


    <button id="startBtn">

      開始掃描

    </button>


    <div id="status">

      等待開始…

    </div>

  </div>

</div>



<div id="hint">

  把鏡頭對準卡片

</div>



<div id="found">

  ✓ 辨識成功

</div>




<script>

const TARGET_IMAGE =
  "./target.jpg";


const INTRO_VIDEO =
  "./intro.mp4";


const LOOP_VIDEO =
  "./loop.mp4";



const ar =
  document.getElementById(
    "ar"
  );


const overlay =
  document.getElementById(
    "overlay"
  );


const startBtn =
  document.getElementById(
    "startBtn"
  );


const statusEl =
  document.getElementById(
    "status"
  );


const hint =
  document.getElementById(
    "hint"
  );


const found =
  document.getElementById(
    "found"
  );



let starting =
  false;



function setStatus(message) {

  statusEl.textContent =
    message;

}



async function requestCamera() {

  if (
    !window.isSecureContext
  ) {

    throw new Error(
      "目前不是 HTTPS 網頁，無法使用相機。"
    );

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "這個瀏覽器無法使用相機。請改用 Chrome 或 Safari。"
    );

  }



  const constraintsList = [

    {

      video: {

        facingMode: {

          exact:
            "environment"

        }

      },

      audio: false

    },


    {

      video: {

        facingMode: {

          ideal:
            "environment"

        }

      },

      audio: false

    },


    {

      video: true,

      audio: false

    }

  ];



  let lastError =
    null;



  for (
    const constraints
    of constraintsList
  ) {

    try {

      const stream =
        await navigator.mediaDevices
          .getUserMedia(
            constraints
          );


      stream
        .getTracks()
        .forEach(

          track =>
            track.stop()

        );


      return;

    }

    catch (error) {

      lastError =
        error;

    }

  }



  throw (
    lastError ||
    new Error(
      "無法開啟相機"
    )
  );

}




function loadImage(url) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () => {

          resolve(
            image
          );

        };


      image.onerror =
        () => {

          reject(

            new Error(
              "找不到 target.jpg"
            )

          );

        };


      image.src =
        url;

    }
  );

}




async function compileTarget() {

  const CompilerClass =

    window.MINDAR?.IMAGE?.Compiler

    ||

    window.MINDAR?.Compiler;



  if (
    !CompilerClass
  ) {

    throw new Error(
      "MindAR 沒有載入成功。"
    );

  }



  setStatus(
    "正在讀取卡片圖片…"
  );


  const image =
    await loadImage(
      TARGET_IMAGE
    );



  const compiler =
    new CompilerClass();



  setStatus(
    "正在建立卡片辨識資料…"
  );



  await compiler
    .compileImageTargets(

      [image],

      progress => {

        const p =

          Math.max(
            0,
            Math.min(
              100,
              Number(progress) || 0
            )
          );


        setStatus(

          "正在建立卡片辨識資料…\n" +

          p.toFixed(0) +

          "%"

        );

      }

    );



  const buffer =
    await compiler
      .exportData();



  const blob =
    new Blob(

      [buffer],

      {

        type:
          "application/octet-stream"

      }

    );



  return URL
    .createObjectURL(
      blob
    );

}




function mountAR(
  mindUrl
) {



  ar.innerHTML = `


  <a-scene

    embedded


    mindar-image="
      imageTargetSrc: ${mindUrl};
      maxTrack: 1;
      filterMinCF: 0.001;
      filterBeta: 0.01;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
    "


    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "


    vr-mode-ui="
      enabled: false
    "


    device-orientation-permission-ui="
      enabled: false
    "

  >



    <a-assets>


      <!--
      開場影片
      不循環
      -->

      <video

        id="introVideo"

        src="${INTRO_VIDEO}"

        preload="auto"

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

      ></video>




      <!--
      循環影片
      -->

      <video

        id="loopVideo"

        src="${LOOP_VIDEO}"

        preload="auto"

        muted

        loop

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

      ></video>


    </a-assets>




    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

    ></a-camera>





    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >





      <!--

      INTRO 影片

      16:9
      所以高 = 9 / 16
      = 0.5625

      -->


      <a-plane

        id="introPlane"

        position="
          0
          0
          0.02
        "

        width="
          1
        "

        height="
          0.5625
        "

        material="
          src: #introVideo;
          shader: flat;
        "

      ></a-plane>






      <!--

      LOOP 影片

      一開始隱藏

      -->


      <a-plane

        id="loopPlane"

        position="
          0
          0
          0.021
        "

        width="
          1
        "

        height="
          0.5625
        "

        visible="
          false
        "

        material="
          src: #loopVideo;
          shader: flat;
        "

      ></a-plane>



    </a-entity>


  </a-scene>

  `;



  const target =

    document.getElementById(
      "target"
    );



  const introVideo =

    document.getElementById(
      "introVideo"
    );



  const loopVideo =

    document.getElementById(
      "loopVideo"
    );



  const introPlane =

    document.getElementById(
      "introPlane"
    );



  const loopPlane =

    document.getElementById(
      "loopPlane"
    );



  let introFinished =
    false;



  let targetVisible =
    false;




  target.addEventListener(

    "targetFound",

    async () => {


      targetVisible =
        true;


      hint.textContent =
        "✓ 辨識成功";


      found
        .classList
        .add(
          "show"
        );


      setTimeout(

        () => {

          found
            .classList
            .remove(
              "show"
            );

        },

        1400

      );




      try {



        if (
          introFinished
        ) {


          introPlane
            .setAttribute(
              "visible",
              false
            );


          loopPlane
            .setAttribute(
              "visible",
              true
            );


          await loopVideo
            .play();

        }


        else {


          introPlane
            .setAttribute(
              "visible",
              true
            );


          loopPlane
            .setAttribute(
              "visible",
              false
            );


          await introVideo
            .play();

        }



      }

      catch (error) {

        console.error(

          "影片播放失敗：",

          error

        );

      }


    }

  );






  target.addEventListener(

    "targetLost",

    () => {


      targetVisible =
        false;


      hint.textContent =
        "把鏡頭對準卡片";


      introVideo.pause();

      loopVideo.pause();


    }

  );






  introVideo.addEventListener(

    "ended",

    async () => {


      introFinished =
        true;



      introPlane
        .setAttribute(
          "visible",
          false
        );



      loopPlane
        .setAttribute(
          "visible",
          true
        );



      loopVideo.currentTime =
        0;



      if (
        targetVisible
      ) {

        try {

          await loopVideo
            .play();

        }

        catch (error) {

          console.error(

            "Loop 播放失敗：",

            error

          );

        }

      }


    }

  );






  introVideo.addEventListener(

    "error",

    () => {

      console.error(
        "intro.mp4 載入失敗"
      );

    }

  );




  loopVideo.addEventListener(

    "error",

    () => {

      console.error(
        "loop.mp4 載入失敗"
      );

    }

  );


}




startBtn.addEventListener(

  "click",

  async () => {


    if (
      starting
    ) {

      return;

    }


    starting =
      true;


    startBtn.disabled =
      true;



    try {



      setStatus(
        "正在要求相機權限…"
      );



      await requestCamera();



      setStatus(
        "✅ 相機權限正常\n正在準備卡片辨識…"
      );



      const mindUrl =
        await compileTarget();



      setStatus(
        "✅ 準備完成"
      );



      overlay.style.display =
        "none";



      hint.style.display =
        "block";



      hint.textContent =
        "把鏡頭對準卡片";



      mountAR(
        mindUrl
      );



    }

    catch (error) {


      console.error(
        error
      );


      let message =

        error?.message

        ||

        String(error);



      if (
        error?.name ===
        "NotAllowedError"
      ) {

        message =

          "相機權限被拒絕。\n\n" +

          "請使用 Chrome / Safari 開啟，" +

          "並允許網站使用相機。";

      }



      setStatus(

        "❌ 啟動失敗\n\n" +

        message

      );



      startBtn.disabled =
        false;


      starting =
        false;


    }


  }

);

</script>


</body>

</html>
