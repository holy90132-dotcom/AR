<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>相機權限測試</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#111827;color:white;margin:0;padding:24px}
.wrap{max-width:520px;margin:auto}
button{width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:800}
pre{white-space:pre-wrap;background:#0b1220;padding:14px;border-radius:12px;margin-top:16px}
video{width:100%;margin-top:16px;border-radius:14px;background:black}
</style>
</head>
<body>
<div class="wrap">
<h2>手機相機權限測試</h2>
<p>按下面按鈕後，瀏覽器應該跳出「允許使用相機」。</p>
<button id="btn">要求開啟相機</button>
<pre id="log">等待操作…</pre>
<video id="video" autoplay playsinline muted></video>
</div>
<script>
const btn = document.getElementById('btn');
const log = document.getElementById('log');
const video = document.getElementById('video');

function show(msg){ log.textContent = msg; }

btn.onclick = async () => {
  show(
    'secureContext = ' + window.isSecureContext + '\n' +
    'protocol = ' + location.protocol + '\n' +
    'mediaDevices = ' + !!navigator.mediaDevices
  );

  if (!window.isSecureContext) {
    show('❌ 目前不是安全環境。\n網址必須是 https:// 開頭（或 localhost）。\n目前：' + location.href);
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    show('❌ 這個瀏覽器 / 目前頁面環境不允許使用相機 API。');
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
    show('✅ 相機已成功開啟。\n如果你看到畫面，代表權限沒問題。');
  } catch (e) {
    show('❌ 開相機失敗\n' + e.name + ': ' + e.message);
  }
};
</script>
</body>
</html>
